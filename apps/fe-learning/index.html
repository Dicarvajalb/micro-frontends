<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fe Learning Root Config</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (() => {
        const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const imports = isLocal
          ? {
              '@my-workspace/cotizaciones': 'http://localhost:4201/src/index.ts',
              '@my-workspace/factura-de-venta': 'http://localhost:4202/src/index.ts',
              '@my-workspace/notas-de-credito': 'http://localhost:4203/src/index.ts',
            }
          : {
              '@my-workspace/cotizaciones': '/cotizaciones/index.js',
              '@my-workspace/factura-de-venta': '/factura-de-venta/index.js',
              '@my-workspace/notas-de-credito': '/notas-de-credito/index.js',
            };

        const importMap = document.createElement('script');
        importMap.type = 'importmap';
        importMap.textContent = JSON.stringify({ imports });
        document.head.appendChild(importMap);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
